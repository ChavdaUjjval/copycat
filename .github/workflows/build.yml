name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the release job, which runs for version tags, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app and disk image
        run: ./build.sh --package

      - name: Checksum
        working-directory: build
        run: shasum -a 256 Copycat.dmg | tee Copycat.dmg.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Copycat
          path: |
            build/Copycat.dmg
            build/Copycat.dmg.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Copycat
          path: dist

      # Lets anyone confirm the disk image was built here: gh attestation verify Copycat.dmg -R <repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Copycat.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Copycat.dmg dist/Copycat.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Copycat $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes
