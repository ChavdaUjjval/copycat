name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and disk image
        run: ./build.sh --package

      - uses: actions/upload-artifact@v4
        with:
          name: Copycat
          path: build/Copycat.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Copycat.dmg --title "Copycat $GITHUB_REF_NAME" --generate-notes
