name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build app and disk image
        run: ./build.sh --package

      - name: Checksum
        working-directory: build
        run: shasum -a 256 Copycat.dmg | tee Copycat.dmg.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Copycat
          path: |
            build/Copycat.dmg
            build/Copycat.dmg.sha256

      # Lets anyone confirm the disk image was built here: gh attestation verify Copycat.dmg -R <repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/Copycat.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Copycat.dmg build/Copycat.dmg.sha256 \
            --title "Copycat $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
