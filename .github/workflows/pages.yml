# Publishes the installer at https://chavdaujjval.github.io/copycat/install, for the short
# install command, and the demo video at /demo.mp4 so the README can link to a playable file.
# The page itself just points to the repository.
name: Pages

on:
  push:
    branches: [main]
    paths: [install.sh, docs/demo.mp4, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build site
        run: |
          mkdir _site
          cp install.sh _site/install
          cp install.sh _site/install.sh
          cp docs/demo.mp4 _site/demo.mp4
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Copycat</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/ChavdaUjjval/copycat">
          <a href="https://github.com/ChavdaUjjval/copycat">Copycat on GitHub</a>
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
